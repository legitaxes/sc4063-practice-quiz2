<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC4063 Network Security — Revision Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0e17;--surface:#111827;--surface2:#1a2332;--surface3:#222d3d;
--border:#2a3545;--border-active:#3b82f6;
--text:#e2e8f0;--text-dim:#94a3b8;--text-muted:#64748b;
--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.15);
--green:#10b981;--green-bg:rgba(16,185,129,0.1);--green-border:rgba(16,185,129,0.3);
--red:#ef4444;--red-bg:rgba(239,68,68,0.08);--red-border:rgba(239,68,68,0.3);
--orange:#f59e0b;--orange-bg:rgba(245,158,11,0.1);
--purple:#a78bfa;
--radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;line-height:1.6}
.app{max-width:860px;margin:0 auto;padding:20px 16px 80px}

/* Header */
.header{text-align:center;padding:48px 0 40px;position:relative}
.header::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 70%);pointer-events:none}
.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);background:var(--accent-glow);border:1px solid rgba(59,130,246,0.2);padding:6px 16px;border-radius:20px;margin-bottom:16px}
.header h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#e2e8f0 0%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.header p{color:var(--text-dim);font-size:15px;max-width:520px;margin:0 auto}

/* Progress */
.progress-wrap{position:sticky;top:0;z-index:100;background:rgba(10,14,23,0.92);backdrop-filter:blur(12px);padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:28px}
.progress-inner{display:flex;align-items:center;gap:14px;max-width:860px;margin:0 auto;padding:0 16px}
.progress-bar-bg{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:3px;transition:width .4s ease}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);white-space:nowrap;min-width:80px;text-align:right}

/* Stats bar */
.stats-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.stat-chip{font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--border)}
.stat-chip.correct{color:var(--green);border-color:var(--green-border);background:var(--green-bg)}
.stat-chip.wrong{color:var(--red);border-color:var(--red-border);background:var(--red-bg)}

/* Topic filter */
.topic-filter{margin-bottom:28px}
.topic-filter label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.topic-pills{display:flex;flex-wrap:wrap;gap:6px}
.topic-pill{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all .2s}
.topic-pill:hover{border-color:var(--accent);color:var(--text)}
.topic-pill.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);font-weight:500}

/* Question card */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;margin-bottom:16px;transition:border-color .3s;position:relative}
.q-card.answered-correct{border-color:var(--green-border)}
.q-card.answered-wrong{border-color:var(--red-border)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.q-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);background:var(--accent-glow);padding:3px 10px;border-radius:4px;font-weight:600}
.q-type{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--purple);background:rgba(167,139,250,0.1);padding:3px 10px;border-radius:4px}
.q-topic{font-size:11px;color:var(--text-muted);margin-left:auto;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.q-text{font-size:16px;font-weight:500;line-height:1.65;margin-bottom:20px;color:var(--text)}

/* Options */
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;background:transparent;position:relative}
.opt:hover:not(.locked){border-color:var(--accent);background:rgba(59,130,246,0.04)}
.opt.selected{border-color:var(--accent);background:var(--accent-glow)}
.opt.locked{cursor:default}
.opt.correct-answer{border-color:var(--green-border);background:var(--green-bg)}
.opt.wrong-answer{border-color:var(--red-border);background:var(--red-bg)}
.opt-marker{width:22px;height:22px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .2s;margin-top:1px}
.opt.selected .opt-marker{border-color:var(--accent);background:var(--accent);color:#fff}
.opt.correct-answer .opt-marker{border-color:var(--green);background:var(--green);color:#fff}
.opt.wrong-answer .opt-marker{border-color:var(--red);background:var(--red);color:#fff}
.single .opt-marker{border-radius:50%}
.opt-text{font-size:14px;line-height:1.5;color:var(--text-dim)}
.opt.selected .opt-text,.opt.correct-answer .opt-text,.opt.wrong-answer .opt-text{color:var(--text)}

/* Submit btn */
.submit-row{margin-top:16px;display:flex;gap:10px;align-items:center}
.btn{font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;padding:10px 24px;border-radius:8px;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--text)}

/* Explanation */
.explanation{margin-top:16px;padding:16px;border-radius:8px;font-size:14px;line-height:1.7;color:var(--text-dim);display:none}
.explanation.show{display:block}
.explanation.correct-exp{background:var(--green-bg);border:1px solid var(--green-border)}
.explanation.wrong-exp{background:var(--red-bg);border:1px solid var(--red-border)}
.explanation strong{color:var(--text);font-weight:600}

/* Results */
.results-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;text-align:center;margin:40px 0}
.results-card h2{font-size:28px;font-weight:700;margin-bottom:8px}
.results-score{font-size:64px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:16px 0}
.results-breakdown{display:flex;justify-content:center;gap:32px;margin:24px 0}
.results-breakdown div{text-align:center}
.results-breakdown .val{font-size:24px;font-weight:700}
.results-breakdown .lbl{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}

/* Scroll to top */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);display:none;align-items:center;justify-content:center;cursor:pointer;font-size:18px;z-index:50;transition:all .2s}
.scroll-top:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.scroll-top.visible{display:flex}

/* nav */
.nav-link{display:inline-block;margin-top:16px;font-size:13px;color:var(--purple);text-decoration:none;border:1px solid rgba(167,139,250,0.3);padding:8px 20px;border-radius:8px;transition:all .2s}
.nav-link:hover{background:rgba(167,139,250,0.1);border-color:var(--purple)}
.btn-row-end{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* hidden */
.hidden{display:none!important}

@media(max-width:600px){
.q-card{padding:20px 16px}
.q-text{font-size:15px}
.results-score{font-size:48px}
}
</style>
</head>
<body>
<div class="app" id="app">

<div class="header" id="header">
<div class="badge">SC4063 — Network Security</div>
<h1>Revision Quiz</h1>
<p>Comprehensive quiz across all lecture topics. Mostly multi-select with some single-answer MCQs.</p>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">

</div>
<div style="margin-top:24px">
<div class="topic-filter">
<label>Filter by topic</label>
<div class="topic-pills" id="topicPills"></div>
</div>
<button class="btn btn-primary" id="startBtn" onclick="startQuiz()">Start Quiz</button>
</div>
</div>

<div class="hidden" id="quizArea">
<div class="progress-wrap">
<div class="progress-inner">
<div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
<div class="progress-label" id="progressLabel">0 / 0</div>
</div>
</div>
<div class="stats-bar" id="statsBar">
<div class="stat-chip correct" id="statCorrect">✓ 0</div>
<div class="stat-chip wrong" id="statWrong">✗ 0</div>
<div class="stat-chip" id="statPending">○ 0 remaining</div>
</div>
<div id="questionsContainer"></div>
<div class="results-card hidden" id="resultsCard">
<h2>Quiz Complete</h2>
<div class="results-score" id="finalScore"></div>
<div class="results-breakdown">
<div><div class="val" style="color:var(--green)" id="finalCorrect">0</div><div class="lbl">Correct</div></div>
<div><div class="val" style="color:var(--red)" id="finalWrong">0</div><div class="lbl">Wrong</div></div>
<div><div class="val" style="color:var(--purple)" id="finalTotal">0</div><div class="lbl">Total</div></div>

</div>
</div>
</div>

<div class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<script>
const ALL_QUESTIONS = [
// ======== TOPIC: Castle & Moat / Perimeter Death ========
{
topic:"Perimeter & Zero Trust",
type:"multi",
q:"Which of the following factors contributed to the 'death of the perimeter' in network security? (Select all that apply)",
opts:["Adoption of cloud services (SaaS/IaaS) placing data outside corporate networks","Widespread remote work making the network edge a user's laptop on public Wi-Fi","Encryption (TLS) blinding traditional perimeter inspection tools","Increased use of stateful firewalls at the network edge"],
correct:[0,1,2],
explain:"The perimeter dissolved due to cloud adoption moving data to third-party infrastructure, remote/mobile work distributing the network edge, and TLS encryption blinding legacy inspection tools. Stateful firewalls are a perimeter defense tool, not a cause of the perimeter's dissolution."
},
{
topic:"Perimeter & Zero Trust",
type:"single",
q:"In the Capital One breach of 2019, what was the root cause that allowed the attacker to steal credentials from the cloud instance?",
opts:["A phishing email targeting an employee","A WAF misconfiguration allowing queries to the AWS Metadata Service (IMDSv1)","An unpatched vulnerability in the EC2 operating system","A brute-force attack on the AWS root account password"],
correct:[1],
explain:"The attacker exploited a Server-Side Request Forgery (SSRF) vulnerability through a misconfigured WAF to query the internal AWS Metadata Service (IMDSv1), which returned temporary IAM credentials without requiring authentication."
},
{
topic:"Perimeter & Zero Trust",
type:"multi",
q:"According to the Zero Trust model (NIST 800-207), which of the following are pillars of verification for every access request? (Select all that apply)",
opts:["Identity: Is this user/service who they claim to be?","Context: Is the device healthy and the location valid?","Privilege: Does the user actually need this specific resource?","Perimeter: Is the request originating from inside the corporate LAN?"],
correct:[0,1,2],
explain:"Zero Trust verification is based on three pillars: Identity, Context (device health, location, behavior), and Privilege (least-privilege access). Network location (perimeter) is explicitly NOT a factor in Zero Trust, which assumes the network is always hostile."
},
{
topic:"Perimeter & Zero Trust",
type:"single",
q:"What is the key architectural difference between a traditional VPN and Zero Trust Network Access (ZTNA)?",
opts:["ZTNA uses stronger encryption algorithms than VPN","VPN connects a user to the network; ZTNA connects a user to a specific application","ZTNA requires on-premise hardware while VPN is cloud-based","VPN uses identity verification while ZTNA uses IP-based access"],
correct:[1],
explain:"The fundamental difference is the access model. VPN is network-centric (connecting the user to the entire network, enabling lateral movement), while ZTNA is application-centric (connecting the user only to the specific authorized application with no broad network visibility)."
},
{
topic:"Perimeter & Zero Trust",
type:"multi",
q:"The Colonial Pipeline ransomware attack (2021) succeeded because of which failures? (Select all that apply)",
opts:["A legacy VPN profile was used for initial access","The VPN account lacked Multi-Factor Authentication (MFA)","The VPN account belonged to a former employee (Leaver failure)","The attackers exploited a zero-day vulnerability in the firewall"],
correct:[0,1,2],
explain:"Colonial Pipeline was breached through a legacy VPN profile without MFA that belonged to a former employee whose account was never deprovisioned. This illustrates failures in both implicit trust (VPN model) and identity governance (the Leaver process)."
},
// ======== TOPIC: Layer 3/4, 5-Tuple, Firewalls ========
{
topic:"Firewalls & Network Controls",
type:"multi",
q:"Why is relying solely on the 5-tuple (Src IP, Dst IP, Src Port, Dst Port, Protocol) insufficient for modern network security? (Select all that apply)",
opts:["L3/L4 controls see connections but not intent or payload content","Attackers tunnel malicious traffic through allowed ports like DNS (UDP 53) and HTTPS (TCP 443)","A banking transaction and a C2 beacon look identical to a Layer 4 firewall if both use TCP 443","The 5-tuple can detect application-layer exploits like SQL injection"],
correct:[0,1,2],
explain:"Layer 3/4 controls are context-blind. They cannot inspect payload content, meaning any traffic on an allowed port passes through regardless of whether it is legitimate or malicious. The 5-tuple cannot detect application-layer attacks."
},
{
topic:"Firewalls & Network Controls",
type:"single",
q:"The OilRig APT group used which technique to exfiltrate data past firewalls?",
opts:["SSH tunneling over port 22","DNS tunneling by encoding stolen data into subdomains of DNS queries","Exploiting a zero-day in the firewall firmware","Man-in-the-middle attack on HTTPS connections"],
correct:[1],
explain:"OilRig used DNS tunneling, encoding stolen data into the subdomains of DNS queries (e.g., [stolen_data].attacker.com). Firewalls allowed this because DNS (UDP 53) is considered essential infrastructure traffic."
},
{
topic:"Firewalls & Network Controls",
type:"multi",
q:"Which of the following are valid firewall deployment models discussed in the lectures? (Select all that apply)",
opts:["Perimeter firewalls at the network edge","Internal segmentation firewalls between departments","Host-based firewalls on individual endpoints","Virtual/cloud firewalls using Security Groups and NSGs"],
correct:[0,1,2,3],
explain:"All four are valid deployment models. Modern defense-in-depth uses perimeter firewalls (North-South), internal segmentation firewalls (lateral movement prevention), host-based firewalls (endpoint isolation), and cloud-native virtual firewalls (micro-segmentation)."
},
{
topic:"Firewalls & Network Controls",
type:"single",
q:"In cloud environments, what is the key difference between Security Groups and Network ACLs (NACLs)?",
opts:["Security Groups are stateless; NACLs are stateful","Security Groups are stateful (auto-allow return traffic); NACLs are stateless (return traffic must be explicitly allowed)","Both are stateful but NACLs operate at the instance level","Security Groups support deny rules while NACLs only support allow rules"],
correct:[1],
explain:"Security Groups are stateful firewalls applied to instances (they auto-allow return traffic and generally only support allow rules). NACLs are stateless, operate at the subnet level, and support both allow and deny rules, requiring explicit rules for return traffic."
},
{
topic:"Firewalls & Network Controls",
type:"multi",
q:"What lessons did the Log4Shell (2021) exploit teach about firewall limitations? (Select all that apply)",
opts:["L3/L4 firewalls could not see the exploit inside encrypted TLS tunnels","Attackers used obfuscation (e.g., ${lower:j}ndi) to evade even WAF signatures","Egress filtering could have broken the exploit chain by blocking outbound LDAP connections","Firewalls alone were sufficient to stop the attack if properly configured"],
correct:[0,1,2],
explain:"Log4Shell demonstrated that L3/L4 firewalls are blind to application-layer exploits in encrypted tunnels, attackers used obfuscation to bypass WAF signatures, and strict egress filtering (blocking the outbound LDAP connection) would have disrupted the exploit chain. Firewalls alone were not sufficient."
},
// ======== TOPIC: Identity & IAM ========
{
topic:"Identity & IAM",
type:"multi",
q:"In Identity Governance and Administration (IGA), the 'Joiner-Mover-Leaver' lifecycle presents specific risks. Which statements are correct? (Select all that apply)",
opts:["Joiners risk receiving excessive default permissions upon onboarding","Movers risk privilege accumulation (privilege creep) when changing roles without losing old access","Leavers present the highest risk due to dormant or forgotten credentials","Movers have the lowest risk since role changes are tracked automatically"],
correct:[0,1,2],
explain:"All three lifecycle stages carry specific risks: Joiners may receive overly broad default access, Movers accumulate privileges across roles (privilege creep), and Leavers represent the highest risk because their credentials may remain active indefinitely if not properly deprovisioned."
},
{
topic:"Identity & IAM",
type:"single",
q:"What is the core concept behind Just-in-Time (JIT) access, as implemented in tools like Azure PIM?",
opts:["Granting permanent admin access but monitoring it continuously","Making admins 'eligible' for roles they must explicitly activate for a limited time window","Providing admin access only during business hours","Requiring managers to perform all administrative tasks on behalf of engineers"],
correct:[1],
explain:"JIT access implements Zero Standing Privileges. Admins are 'eligible' for a role but do not hold it permanently. They must activate it through a workflow (e.g., MFA challenge, approval) and access is granted only for a specific time window before being automatically revoked."
},
{
topic:"Identity & IAM",
type:"multi",
q:"In the context of modern security, why is the statement 'Attackers don't break in, they log in' significant? (Select all that apply)",
opts:["Credential theft via phishing and password spraying is low-cost and highly effective","An attacker with valid credentials bypasses perimeter defenses entirely","Traditional firewalls cannot distinguish a legitimate user from an attacker using stolen credentials","This means firewalls and encryption are no longer needed"],
correct:[0,1,2],
explain:"Credential-based attacks are cheap and effective. Once attackers have valid credentials, they appear as legitimate users to firewalls and access controls, creating a massive visibility gap. This does NOT mean firewalls/encryption are unnecessary; rather, they must be supplemented with behavioral monitoring."
},
{
topic:"Identity & IAM",
type:"single",
q:"The LAPSUS$ group's attack on Okta in 2022 is an example of which MITRE ATT&CK technique?",
opts:["T1190 — Exploit Public-Facing Application","T1199 — Trusted Relationships","T1027 — Obfuscated Files or Information","T1485 — Data Destruction"],
correct:[1],
explain:"LAPSUS$ exploited Trusted Relationships (T1199). They compromised an Okta support engineer and used that trusted vendor access to pivot 'East-West' into customer tenants, riding the API integrations that businesses depend on."
},
// ======== TOPIC: Networking Fundamentals ========
{
topic:"Networking Fundamentals",
type:"multi",
q:"Which statements about ICMP are correct from a security perspective? (Select all that apply)",
opts:["Completely blocking ICMP can break Path MTU Discovery and cause connectivity issues","Attackers use ICMP for reconnaissance through ping sweeps and network mapping","ICMP should be selectively allowed, rate-limited, and monitored rather than fully blocked","ICMP is only used for ping and has no other diagnostic functions"],
correct:[0,1,2],
explain:"ICMP is a double-edged sword: essential for diagnostics (ping, traceroute, error reporting) but exploitable for reconnaissance and DoS. Best practice is to selectively allow needed types, rate-limit, and monitor for anomalies rather than fully blocking it."
},
{
topic:"Networking Fundamentals",
type:"single",
q:"How does traceroute use the TTL field to discover the network path?",
opts:["It sends packets with incrementally increasing TTL values, collecting ICMP Time Exceeded messages from each hop","It sends packets with the maximum TTL and reads the response headers","It queries each router's ARP table sequentially","It uses BGP route advertisements to trace the path"],
correct:[0],
explain:"Traceroute sends packets starting with TTL=1. The first router decrements it to 0, drops the packet, and sends an ICMP Time Exceeded message revealing its identity. Traceroute then increments TTL to 2, 3, etc., mapping each hop along the path."
},
{
topic:"Networking Fundamentals",
type:"multi",
q:"Why is IP fragmentation a security concern? (Select all that apply)",
opts:["Overlapping or malformed fragments can be used to evade intrusion detection systems","Security devices inspecting individual fragments without reassembly may miss malicious payloads","Fragmentation increases the attack surface and complicates monitoring","Fragmentation makes packets immune to firewall inspection"],
correct:[0,1,2],
explain:"Fragmentation is a security concern because attackers use overlapping/malformed fragments to confuse IDS/firewalls, devices that do not perform full reassembly may miss attacks, and it generally increases complexity and attack surface. However, modern firewalls perform reassembly before inspection."
},
{
topic:"Networking Fundamentals",
type:"single",
q:"At which OSI layer does a stateful firewall primarily operate to track connections?",
opts:["Layer 2 — Data Link","Layer 4 — Transport","Layer 7 — Application","Layer 1 — Physical"],
correct:[1],
explain:"Stateful firewalls primarily operate at Layer 4 (Transport), tracking TCP/UDP connections and their state (SYN, ESTABLISHED, etc.) to enforce rules like 'only allow return traffic for sessions we initiated.' They see ports and connection state, but not application-layer content."
},
{
topic:"Networking Fundamentals",
type:"multi",
q:"Which of the following are common Layer 4 (Transport Layer) attacks? (Select all that apply)",
opts:["TCP SYN floods that exhaust server connection resources","UDP amplification attacks using spoofed source addresses","Port scanning to discover listening services","SQL injection targeting web application databases"],
correct:[0,1,2],
explain:"SYN floods, UDP amplification, and port scanning are all Layer 4 attacks targeting TCP/UDP connection handling and service discovery. SQL injection is a Layer 7 (Application) attack targeting the application logic, not the transport layer."
},
// ======== TOPIC: Network Security Monitoring ========
{
topic:"Network Security Monitoring",
type:"multi",
q:"In a packet capture architecture, why must NIC offloading features (TSO/LRO) be disabled on capture interfaces? (Select all that apply)",
opts:["TSO/LRO present a 'fake' view showing packets larger than the actual MTU","IDS signature matching may fail against artificially large packets created by LRO","Checksums may appear missing or invalid, confusing analysis tools","Offloading makes the capture faster, which is always desirable"],
correct:[0,1,2],
explain:"NIC offloading (TSO/LRO) reassembles or segments packets on the card, presenting packets to the capture tool that do not match what is actually on the wire. This causes IDS signature failures, incorrect checksums, and unreliable forensic evidence. Offloading must be disabled on capture interfaces."
},
{
topic:"Network Security Monitoring",
type:"single",
q:"What is the primary purpose of 'flow affinity' (symmetric hashing) when load-balancing traffic across multiple IDS sensors?",
opts:["To distribute traffic equally using round-robin","To ensure both sides of every conversation (the full 5-tuple flow) are sent to the same sensor","To encrypt the traffic before it reaches the sensor","To compress packets for faster processing"],
correct:[1],
explain:"IDS sensors are stateful and need to see the entire conversation. Flow affinity uses symmetric hashing on the 5-tuple to ensure all packets from a specific connection go to the same sensor, preventing fragmented conversations and detection failures."
},
{
topic:"Network Security Monitoring",
type:"multi",
q:"Which of the following are reasons why full packet capture (PCAP) data is typically stored in a 'rolling buffer' rather than indefinitely? (Select all that apply)",

explain:"Attackers use Generative AI and dictionary-based algorithms to produce domains that look like normal words (low entropy) rather than random strings (high entropy). This defeats traditional entropy-based DGA detection, leading to a 'Machine vs. Machine' warfare dynamic."
},
// ======== TOPIC: Network Security as System ========
{
topic:"Architecture Concepts",
type:"single",
q:"Stallings makes a critical distinction between 'Security Mechanisms' and 'Security Services.' What is this distinction?",
opts:["Security Mechanisms are the outcomes; Security Services are the tools","Security Mechanisms are specific methods (encryption, digital signatures); Security Services are outcomes (Confidentiality, Integrity)","They are interchangeable terms for the same concepts","Security Mechanisms only apply to cloud; Security Services only apply to on-premise"],
correct:[1],
explain:"Stallings distinguishes between mechanisms (the HOW: encryption, access controls, digital signatures) and services (the WHAT: confidentiality, integrity, availability, authentication). Modern security views the overall system and its services as the goal, not any individual mechanism or tool."
},
{
topic:"Architecture Concepts",
type:"multi",
q:"Continuous Adaptive Risk and Trust Assessment (CARTA) differs from traditional FIPS 199 categorization in which ways? (Select all that apply)",
opts:["CARTA treats security as a real-time, dynamic risk management problem","Risk signals include identity, device posture, location, time, and behavior","Controls adjust dynamically based on risk score rather than remaining fixed","CARTA categorizes systems once as Low, Moderate, or High and never reassesses"],
correct:[0,1,2],
explain:"CARTA is dynamic and continuous, evaluating risk in real-time based on multiple signals (identity, device, location, behavior) and adjusting controls accordingly. FIPS 199 is static categorization. CARTA catches anomalies like 'impossible travel' that static models miss."
},
// ======== TOPIC: Policy as Code, OPA ========
{
topic:"Architecture Concepts",
type:"single",
q:"What does 'Policy as Code' using tools like Open Policy Agent (OPA) achieve?",

correct:[1],
explain:"Policy as Code (OPA) decouples security rules from application logic, enforcing them at the infrastructure level. If a deployment violates a policy (e.g., a public load balancer without the correct tag), it is automatically rejected. This shifts from 'detecting' bad behavior to 'preventing' it."
},

{

type:"multi",

correct:[0,1,2],
explain:"Legal evidence handling requires: Chain of Custody documentation, cryptographic hashing for integrity verification, and immutable/WORM storage to prevent modification. Storing evidence on personal devices would break chain of custody and compromise evidentiary integrity."

// ---- State ----
let activeTopics = new Set();
let filteredQs = [];
let answers = {};
let correctCount = 0, wrongCount = 0;

// ---- Init ----
const topics = [...new Set(ALL_QUESTIONS.map(q=>q.topic))];
const pillsEl = document.getElementById('topicPills');

function renderPills(){
  pillsEl.innerHTML = `<button class="topic-pill ${activeTopics.size===0?'active':''}" onclick="toggleTopic(null)">All Topics</button>`;
  topics.forEach(t=>{
    pillsEl.innerHTML += `<button class="topic-pill ${activeTopics.has(t)?'active':''}" onclick="toggleTopic('${t}')">${t}</button>`;
  });
}
function toggleTopic(t){
  if(t===null){activeTopics.clear();}
  else{
    if(activeTopics.has(t)) activeTopics.delete(t); else activeTopics.add(t);
  }
  renderPills();
}
renderPills();

// ---- Quiz ----
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function startQuiz(){
  filteredQs = activeTopics.size===0 ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q=>activeTopics.has(q.topic));
  shuffle(filteredQs);
  answers={};correctCount=0;wrongCount=0;
  document.getElementById('header').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('resultsCard').classList.add('hidden');
  renderQuestions();
  updateStats();
  window.scrollTo({top:0});
}

function renderQuestions(){
  const c = document.getElementById('questionsContainer');
  c.innerHTML='';
  filteredQs.forEach((q,i)=>{
    const isMulti = q.type==='multi';
    const letters = ['A','B','C','D'];
    let optHtml = q.opts.map((o,j)=>`
      <div class="opt" data-qi="${i}" data-oi="${j}" onclick="selectOpt(${i},${j})">
        <div class="opt-marker">${letters[j]}</div>
        <div class="opt-text">${o}</div>
      </div>`).join('');
    c.innerHTML += `
    <div class="q-card" id="qcard-${i}">
      <div class="q-meta">
        <span class="q-num">Q${i+1}</span>
        <span class="q-type">${isMulti?'Multi-Select':'Single Answer'}</span>
        <span class="q-topic">${q.topic}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options ${isMulti?'multi':'single'}" id="opts-${i}">${optHtml}</div>
      <div class="submit-row" id="sub-${i}">
        <button class="btn btn-primary" id="subbtn-${i}" onclick="submitAnswer(${i})" disabled>Submit</button>
      </div>
      <div class="explanation" id="exp-${i}"></div>
    </div>`;
  });
}

function selectOpt(qi,oi){
  if(answers[qi]!==undefined) return;
  const q = filteredQs[qi];
  const isMulti = q.type==='multi';
  const opts = document.querySelectorAll(`#opts-${qi} .opt`);
  if(isMulti){
    opts[oi].classList.toggle('selected');
  } else {
    opts.forEach(o=>o.classList.remove('selected'));
    opts[oi].classList.add('selected');
  }
  const sel = document.querySelectorAll(`#opts-${qi} .opt.selected`);
  document.getElementById(`subbtn-${qi}`).disabled = sel.length===0;
}

function submitAnswer(qi){
  if(answers[qi]!==undefined) return;
  const q = filteredQs[qi];
  const opts = document.querySelectorAll(`#opts-${qi} .opt`);
  const selected = [];
  opts.forEach((o,j)=>{if(o.classList.contains('selected')) selected.push(j);});

  // Lock options
  opts.forEach(o=>o.classList.add('locked'));

  // Check correctness
  const correctSet = new Set(q.correct);
  const selectedSet = new Set(selected);
  const isCorrect = correctSet.size===selectedSet.size && [...correctSet].every(v=>selectedSet.has(v));

  // Mark answers
  opts.forEach((o,j)=>{
    if(correctSet.has(j)) o.classList.add('correct-answer');
    if(selectedSet.has(j) && !correctSet.has(j)) o.classList.add('wrong-answer');
  });

  const card = document.getElementById(`qcard-${qi}`);
  card.classList.add(isCorrect?'answered-correct':'answered-wrong');

  const exp = document.getElementById(`exp-${qi}`);
  exp.className = `explanation show ${isCorrect?'correct-exp':'wrong-exp'}`;
  exp.innerHTML = `<strong>${isCorrect?'✓ Correct!':'✗ Incorrect.'}</strong> ${q.explain}`;

  document.getElementById(`sub-${qi}`).innerHTML = `<span style="font-size:13px;color:${isCorrect?'var(--green)':'var(--red)'};font-weight:600">${isCorrect?'Correct':'Incorrect'}</span>`;

  answers[qi] = isCorrect;
  if(isCorrect) correctCount++; else wrongCount++;
  updateStats();

  // Check if quiz complete
  if(Object.keys(answers).length === filteredQs.length){
    setTimeout(showResults, 600);
  }
}

function updateStats(){
  const total = filteredQs.length;
  const answered = Object.keys(answers).length;
  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
  document.getElementById('statCorrect').textContent = `✓ ${correctCount}`;
  document.getElementById('statWrong').textContent = `✗ ${wrongCount}`;
  document.getElementById('statPending').textContent = `○ ${total - answered} remaining`;
}

function showResults(){
  const total = filteredQs.length;
  const pct = Math.round((correctCount/total)*100);
  document.getElementById('finalScore').textContent = `${pct}%`;
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalWrong').textContent = wrongCount;
  document.getElementById('finalTotal').textContent = total;
  document.getElementById('resultsCard').classList.remove('hidden');
  document.getElementById('reviewBtn').style.display = wrongCount>0?'inline-block':'none';
  document.getElementById('resultsCard').scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('quizArea').classList.add('hidden');
  window.scrollTo({top:0});
}

function reviewWrong(){
  const cards = document.querySelectorAll('.q-card');
  cards.forEach((c,i)=>{
    if(answers[i]===true) c.style.display='none';
    else c.style.display='';
  });
  document.getElementById('resultsCard').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

// Scroll to top btn
window.addEventListener('scroll',()=>{
  document.getElementById('scrollTop').classList.toggle('visible', window.scrollY>400);
});
</script>
