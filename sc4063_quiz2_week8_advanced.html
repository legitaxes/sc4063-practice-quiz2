<script>
const ALL_QUESTIONS=[
// ===== CLOUD SECURITY =====
{topic:"Cloud Security",type:"multi",q:"Under the Shared Responsibility Model, which two things ALWAYS remain the customer's responsibility regardless of service model (IaaS, PaaS, or SaaS)?",opts:["Data classification and encryption","Identity and access management","Physical data center security","Hypervisor patching and maintenance"],correct:[0,1],explain:"Regardless of whether you use IaaS, PaaS, or SaaS, data and identity always remain the customer's responsibility. The cloud provider handles physical security and the hypervisor as part of securing 'the cloud.'"},
{topic:"Cloud Security",type:"single",q:"In a SaaS model like Salesforce or Microsoft 365, the customer's security responsibility shifts almost entirely to:",opts:["Patching the underlying operating system","Managing the physical network fabric","Configuration and access control (identity becomes the new perimeter)","Writing and deploying the application code"],correct:[2],explain:"In SaaS, the provider manages the entire stack including application code and infrastructure. The customer's responsibility narrows to managing user identities, enforcing MFA, and configuring data sharing settings. Identity becomes the new perimeter."},
{topic:"Cloud Security",type:"multi",q:"Which of the following are attacker objectives specific to cloud environments as mapped to MITRE ATT&CK? (Select all that apply)",opts:["Identity Takeover via stolen SSO tokens or IMDS credential theft (T1078)","Persistence through creating shadow IAM users or modifying Lambda function code (T1098)","Supply Chain Compromise by poisoning public Docker Hub images (T1195)","Exploiting buffer overflow vulnerabilities in the cloud provider's hypervisor"],correct:[0,1,2],explain:"Cloud-specific attack objectives include identity takeover, persistence via IAM manipulation or function backdoors, and supply chain compromise through poisoned container images. Hypervisor security is the cloud provider's responsibility and not a typical customer-facing attack vector."},
{topic:"Cloud Security",type:"multi",q:"What makes 'Consent Abuse' (illicit consent grants) a particularly dangerous cloud identity attack? (Select all that apply)",opts:["The attacker never needs to steal the user's password","Persistence remains even if the user changes their password because the granted permission belongs to the malicious application","The attack exploits the OAuth trust model by tricking users into granting permissions to a malicious app","It requires the attacker to have physical access to the user's device"],correct:[0,1,2],explain:"Consent Abuse exploits OAuth by tricking users into granting permissions (like Mail.Read) to a malicious app. No password theft is needed, and changing passwords does not revoke the app's granted access. No physical device access is required."},
{topic:"Cloud Security",type:"single",q:"What is 'Envelope Encryption' in the context of cloud key management?",opts:["Encrypting emails before sending them through a cloud mail server","A hierarchy where a Key Encrypting Key (KEK) in KMS protects a Data Encryption Key (DEK) that encrypts the actual data, enabling cryptographic erasure by destroying the KEK","Using two different passwords to encrypt the same file","Wrapping API keys inside environment variables for secure storage"],correct:[1],explain:"Envelope Encryption uses a hierarchy: a KEK stored in KMS protects a DEK located near the data. The DEK encrypts the data itself. To destroy massive amounts of data, you simply destroy the KEK (cryptographic erasure), rendering all data encrypted by its DEKs permanently unreadable."},
{topic:"Cloud Security",type:"multi",q:"When securing object storage (S3, Azure Storage, GCP Cloud Storage), which controls should be implemented? (Select all that apply)",opts:["Enable 'Block Public Access' at the account level in AWS to override permissive ACLs","Disable 'Allow Blob Public Access' in Azure and prefer SAS tokens or Entra ID over long-lived account keys","Enforce 'Uniform Bucket-Level Access' in GCP to disable legacy ACLs","Enable versioning and object locking (WORM) to defend against ransomware and accidental deletion"],correct:[0,1,2,3],explain:"All four controls are critical for object storage security. Each addresses a common misconfiguration vector: public access overrides (AWS), key-based authentication risks (Azure), legacy ACL complexity (GCP), and destructive attacks via versioning/WORM (all providers)."},
{topic:"Cloud Security",type:"single",q:"In cloud logging, what distinguishes 'Control Plane' logs from 'Data Plane' logs?",opts:["Control Plane logs record user browsing activity; Data Plane logs record server CPU usage","Control Plane logs record administrative actions (creating VMs, modifying IAM); Data Plane logs capture actual data interactions (S3 file downloads, database queries)","They are the same type of log with different names across cloud providers","Control Plane logs are encrypted; Data Plane logs are stored in plaintext"],correct:[1],explain:"Control Plane (Management Plane) logs capture WHO did WHAT to the infrastructure (create VM, modify IAM role). Data Plane logs capture interactions WITH the data itself (file downloads, DB queries). Data Plane logs are high-volume and often disabled by default due to cost."},
{topic:"Cloud Security",type:"multi",q:"Amazon GuardDuty provides intelligent threat detection by consuming which data sources? (Select all that apply)",opts:["CloudTrail logs","VPC Flow Logs","DNS query logs","Physical access badge logs from AWS data centers"],correct:[0,1,2],explain:"GuardDuty consumes CloudTrail, VPC Flow Logs, and DNS logs to identify malicious behaviors like compromised instances or unauthorized reconnaissance using machine learning and threat intelligence. Physical access logs are internal to AWS and not exposed to customers."},
{topic:"Cloud Security",type:"multi",q:"Why must snapshots and backups be stored in a separate, isolated cloud account? (Select all that apply)",opts:["If an attacker compromises the production account, they cannot also delete the recovery points","It prevents a single set of administrative credentials from accessing both live data and backups","Features like AWS Backup Vault Lock enforce WORM compliance to prevent deletion","Storing backups in the same account guarantees faster recovery times"],correct:[0,1,2],explain:"Storing backups in a separate account with different credentials prevents a single compromise from wiping both production data and recovery points (as happened to Code Spaces). WORM/Vault Lock features add further protection. Same-account storage is the vulnerability, not a benefit."},
{topic:"Cloud Security",type:"single",q:"What is 'Configuration Drift' and why is it dangerous in cloud environments?",opts:["A planned migration of workloads from one cloud region to another","When systems gradually deviate from their approved secure baseline due to manual changes, emergency fixes, or inconsistent deployments, silently weakening security controls","A feature that automatically updates cloud configurations to the latest best practices","The process of rotating encryption keys on a regular schedule"],correct:[1],explain:"Configuration Drift occurs when systems silently deviate from their intended secure state. In cloud environments where thousands of API-driven changes happen hourly, drift is inevitable. It weakens security controls without generating alerts, creating exploitable gaps from assumptions that are no longer true."},
// ===== CLOUD NETWORKING =====
{topic:"Cloud Networking",type:"single",q:"How does GCP's VPC model fundamentally differ from AWS and Azure?",opts:["GCP VPCs are bound to a single Availability Zone","GCP VPCs are global resources that span all available regions immediately, while AWS and Azure VPCs/VNets are regional","GCP does not support subnets within VPCs","GCP VPCs cannot use firewall rules"],correct:[1],explain:"GCP's VPC is a global resource spanning all regions upon creation with automatic dynamic routing between subnets. AWS VPCs and Azure VNets are scoped to a single region, requiring peering or VPN for cross-region connectivity."},
{topic:"Cloud Networking",type:"multi",q:"What are Azure Application Security Groups (ASGs) and why are they valuable? (Select all that apply)",opts:["They are logical labels applied to VMs by function (e.g., 'WebServers') rather than IP address","They can be referenced in NSG rules, eliminating the need to update firewall rules when VM IPs change","They allow security policies based on business logic rather than network topology","They replace Network Security Groups entirely"],correct:[0,1,2],explain:"ASGs are logical identifiers applied to VMs by function. They are referenced WITHIN NSG rules (not replacing them) to enable application-centric security policies that remain valid regardless of IP changes. This dramatically reduces rule complexity in dynamic environments."},
{topic:"Cloud Networking",type:"single",q:"Why is 'Centralized Egress' an important security pattern in cloud architecture?",opts:["It allows each workload to connect directly to the internet for faster performance","It routes all outbound traffic through a dedicated egress VPC with NAT gateways and filtering proxies, creating a single exit point for URL filtering, DLP, and logging","It eliminates the need for any firewall rules on individual instances","It is only applicable to on-premise data centers, not cloud environments"],correct:[1],explain:"Centralized Egress stops individual workloads from having direct internet gateways. By funneling all outbound traffic through a dedicated exit point, you gain high-fidelity logging, strict URL filtering, DLP enforcement, and make it significantly harder for attackers to establish C2 channels or exfiltrate data undetected."},
{topic:"Cloud Networking",type:"multi",q:"What security risks does Split Tunneling in client VPN configurations introduce? (Select all that apply)",opts:["The endpoint becomes a bridge between the unsecured internet and the corporate network","Corporate inspection points are bypassed for internet-bound traffic","An attacker who compromises the endpoint via the open internet can pivot into the private network"],correct:[0,1,2],explain:"Split tunneling allows direct internet access alongside VPN, creating three critical risks: the endpoint bridges trusted and untrusted networks, internet traffic bypasses corporate security controls, and a compromised endpoint provides an attacker a direct path into the corporate network."},
// ===== WORKLOAD SECURITY =====
{topic:"Workload Security",type:"multi",q:"What are the key differences between CSPM and CWPP? (Select all that apply)",opts:["CSPM scans cloud configurations against baselines like CIS Benchmarks","CWPP focuses on runtime protection of compute workloads (VMs, containers, serverless)","CSPM detects misconfigurations like publicly accessible S3 buckets","CWPP provides behavioral analysis and vulnerability scanning at the workload level"],correct:[0,1,2,3],explain:"CSPM (Cloud Security Posture Management) is the 'config watchdog' scanning API settings against baselines. CWPP (Cloud Workload Protection Platform) is the 'runtime defense' protecting actual compute workloads with vulnerability scanning, behavioral analysis, and file integrity monitoring. Both are needed."},
{topic:"Workload Security",type:"single",q:"In container security, what does the SLSA (Supply-chain Levels for Software Artifacts) framework aim to prevent?",opts:["Runtime container escapes to the host kernel","Tampering during the build process by ensuring provenance and integrity of artifacts","DNS cache poisoning attacks against container registries","Denial of Wallet attacks on serverless functions"],correct:[1],explain:"SLSA is a framework specifically designed to prevent tampering during the software build process. It establishes provenance (where an artifact came from) and integrity (that it has not been modified) through cryptographic signing tools like Cosign and attestation of build parameters."},
{topic:"Workload Security",type:"multi",q:"What is the role of Kubernetes Admission Controllers in container security? (Select all that apply)",opts:["They intercept API requests to create pods BEFORE they are persisted to the cluster","They can reject deployments that violate security policies (e.g., unsigned images or untrusted registries)","Tools like OPA Gatekeeper enforce 'Policy as Code' at the deployment gate","They replace the need for container image scanning in CI/CD pipelines"],correct:[0,1,2],explain:"Admission Controllers act as a final security gate, intercepting pod creation requests and enforcing policies before deployment. OPA Gatekeeper rejects non-compliant deployments. However, they complement (not replace) CI/CD scanning, which catches vulnerabilities earlier in the pipeline."},
{topic:"Workload Security",type:"multi",q:"In serverless (FaaS) security, why is 'Event Injection' a critical concern? (Select all that apply)",opts:["Functions can be triggered by diverse events (S3 uploads, DB changes, queues), each being an entry point for malicious data","Developers may bypass ORMs for performance, reintroducing SQL injection vulnerabilities","Command injection can extract sensitive environment variables like AWS_SESSION_TOKEN","Event injection only affects HTTP-triggered functions, not storage or queue triggers"],correct:[0,1,2],explain:"Event Injection is critical because serverless functions respond to many trigger types beyond HTTP (S3, DynamoDB, SQS). Each is an attack vector. Performance-focused developers may bypass ORMs, and command injection can steal cloud credentials from environment variables. ALL trigger types are at risk, not just HTTP."},
{topic:"Workload Security",type:"single",q:"Why is the default Google App Engine service account a security risk?",opts:["It has no permissions and cannot access any resources","It is often granted the 'Editor' role, providing read/write access to the entire project, meaning a single compromised app inherits excessive permissions","It is publicly accessible without authentication","It automatically rotates every 24 hours, causing service disruptions"],correct:[1],explain:"Google App Engine's default service account is often granted the 'Editor' role (read/write to the entire project). If an attacker compromises one app on that PaaS instance, they inherit those excessive permissions and can pivot to compromise every other resource in the project. Custom least-privilege accounts must replace defaults."},
{topic:"Workload Security",type:"multi",q:"In virtualized environments, why is East-West traffic a critical blind spot? (Select all that apply)",opts:["VM-to-VM traffic on the same physical host may never hit the physical wire, making it invisible to physical monitoring tools","Traditional perimeter security tools cannot see internal lateral movement between VMs","Microsegmentation addresses this by applying security policies at the individual workload level"],correct:[0,1,2],explain:"East-West traffic between VMs (especially on the same host) bypasses physical switches entirely, creating a blind spot for traditional tap/SPAN-based monitoring. Microsegmentation solves this by enforcing Zero Trust policies at each virtual network interface, preventing lateral movement even within the same subnet."},
// ===== WEB/APP SECURITY =====
{topic:"Web & App Security",type:"single",q:"In the three-tier architecture, why must the Presentation tier NEVER communicate directly with the Persistence tier?",opts:["It would cause performance bottlenecks due to excessive database queries","It violates the separation principle; if an attacker compromises the web server, they must pivot through the Application tier rather than having direct database access","The Presentation tier cannot understand SQL queries","Modern frameworks do not support this configuration"],correct:[1],explain:"Tier isolation ensures compromise containment. If the web server (Presentation) is breached, the attacker cannot directly access the database. They must first compromise the Application tier, which acts as a gatekeeper enforcing authorization rules before any database interaction occurs."},
{topic:"Web & App Security",type:"multi",q:"What does the Same-Origin Policy (SOP) protect against, and what are its limits? (Select all that apply)",opts:["SOP prevents scripts on one origin from reading data from a different origin (defined by Protocol + Host + Port)","SOP blocks embedding of cross-origin resources like images and scripts","SOP protects session cookies and DOM data from cross-site script access","CORS provides a mechanism for servers to explicitly relax SOP restrictions"],correct:[0,2,3],explain:"SOP prevents cross-origin data READING (protecting cookies, DOM, localStorage). However, SOP does NOT block embedding of cross-origin resources like images, scripts, or iframes. CORS allows servers to selectively relax SOP through headers like Access-Control-Allow-Origin."},
{topic:"Web & App Security",type:"multi",q:"Why is storing JWTs in browser Local Storage risky, and what is the alternative trade-off? (Select all that apply)",opts:["Local Storage is accessible to JavaScript, making tokens vulnerable to XSS exfiltration","HttpOnly cookies prevent JavaScript access but introduce CSRF risk","SameSite cookie attributes and double-submit cookies help mitigate CSRF when using cookie storage","Local Storage automatically encrypts all stored data"],correct:[0,1,2],explain:"Local Storage is fully accessible to JavaScript (XSS risk). HttpOnly cookies block JS access (mitigating XSS) but introduce CSRF risk. SameSite attributes and double-submit patterns mitigate CSRF. Local Storage does NOT encrypt data, which is precisely the vulnerability."},
{topic:"Web & App Security",type:"single",q:"What is the primary purpose of the Content Security Policy (CSP) header?",opts:["To encrypt all traffic between the browser and server","To define an allowlist of trusted sources from which the browser may load and execute resources (scripts, images), significantly reducing XSS impact","To compress HTTP responses for faster page loading","To authenticate the user's browser before allowing access to the site"],correct:[1],explain:"CSP allows site owners to specify exactly which sources can load scripts, images, and other resources. A strong CSP can disable inline scripts and dangerous functions like eval(), ensuring only vetted code runs in the browser context. The frame-ancestors directive also prevents clickjacking."},
{topic:"Web & App Security",type:"multi",q:"How does the X-Forwarded-For header create 'Trust Confusion' security risks? (Select all that apply)",opts:["Proxies/CDNs insert it to preserve the original client IP, but attackers can spoof it","If a WAF or backend trusts this header without sanitization, attackers can bypass IP-based access controls","It creates a 'confused deputy' scenario where shared infrastructure blindly trusts arbitrary metadata"],correct:[0,1,2],explain:"When traffic passes through proxies/CDNs, X-Forwarded-For preserves the original client IP. But since it is an arbitrary header, attackers can spoof it. If backends trust it without validation, attackers bypass IP-based controls. This 'confused deputy' problem requires validating all metadata at every trust boundary."},
{topic:"Web & App Security",type:"single",q:"What does HSTS (HTTP Strict Transport Security) protect against?",opts:["SQL injection attacks by sanitizing input","SSL stripping attacks by forcing browsers to communicate exclusively over HTTPS and preventing users from bypassing certificate warnings","Cross-Site Request Forgery by validating origin headers","DNS cache poisoning by encrypting DNS queries"],correct:[1],explain:"HSTS forces browsers to use HTTPS exclusively (converting http:// to https:// automatically) and prevents users from clicking through certificate warnings. This mitigates SSL stripping attacks where an adversary downgrades a secure connection to cleartext."},
{topic:"Web & App Security",type:"multi",q:"In the context of mTLS and service meshes, what does a 'Sidecar' proxy pattern achieve? (Select all that apply)",opts:["It handles mTLS encryption between services without developers writing crypto code","It ensures consistent security across polyglot services (Java, Go, Node) regardless of language","The application only talks to localhost while the sidecar handles all network security transparently","It requires each development team to implement their own TLS library"],correct:[0,1,2],explain:"The Sidecar pattern (e.g., Envoy proxy) is attached to every pod and handles mTLS, certificate rotation, and logging transparently. Applications just talk to localhost. This abstracts security into infrastructure, ensuring consistency across all languages. Developers do NOT implement TLS themselves, which is the entire point."},
// ===== API SECURITY =====
{topic:"API Security",type:"multi",q:"What distinguishes BOLA from BFLA in API security? (Select all that apply)",opts:["BOLA involves accessing data RECORDS that do not belong to you (horizontal privilege escalation)","BFLA involves executing FUNCTIONS or actions you are not authorized to perform (vertical privilege escalation)","BOLA exploits predictable object IDs; BFLA exploits hidden endpoints or method manipulation","Both can be fully detected by automated scanners without manual testing"],correct:[0,1,2],explain:"BOLA is about unauthorized data access (changing an ID to see another user's records). BFLA is about unauthorized function execution (accessing admin endpoints or changing HTTP methods). Both require understanding of business logic and are notoriously difficult for automated scanners to detect."},
{topic:"API Security",type:"single",q:"Why is the 'Authenticated Equals Authorized' assumption a dangerous API design fallacy?",opts:["Because authentication is never needed for API access","Because having a valid session/token does not mean the user has the right to access the specific resource they are requesting, leading to BOLA vulnerabilities","Because authorization tokens expire too quickly to be useful","Because APIs do not support authentication mechanisms"],correct:[1],explain:"The fallacy occurs when developers assume that a valid session token means the user can access any resource. They bind user input directly to database queries via ORMs without checking if the specific identity owns the specific record, which is the root cause of BOLA."},
{topic:"API Security",type:"multi",q:"What is 'Mass Assignment' and how does it violate the principle of least privilege? (Select all that apply)",opts:["Frameworks automatically bind untrusted client input directly to internal code objects or database models","Users can overwrite internal variables they should not modify (e.g., is_admin, account_balance, role)","Prevention requires whitelisting which specific fields are updatable rather than accepting all input"],correct:[0,1,2],explain:"Mass Assignment occurs when frameworks auto-bind client input to backend models without filtering. This lets users modify protected fields (is_admin, balance) they were never intended to touch. Using explicit whitelists for updatable fields enforces least privilege and prevents this vulnerability class."},
{topic:"API Security",type:"single",q:"In the USPS Informed Visibility API breach, what vulnerability allowed any authenticated user to access 60 million records?",opts:["SQL injection in the search endpoint","BOLA: any authenticated user could query other users' account details by manipulating IDs or using wildcard parameters","A misconfigured WAF that allowed all traffic through","An exposed debug endpoint that returned the entire database"],correct:[1],explain:"The USPS API breach was a textbook BOLA vulnerability. Any authenticated user could access any other user's data simply by changing ID parameters or using wildcards. The system verified authentication but never checked if the requesting user was authorized to access the specific records."},
{topic:"API Security",type:"multi",q:"What are 'Zombie APIs' and 'Shadow APIs'? (Select all that apply)",opts:["Zombie APIs are deprecated versions that remain accessible but unpatched, lacking current security controls","Shadow APIs are undocumented endpoints that exist but are unknown to the security team","Both represent unguarded entry points that attackers specifically target","They are automatically detected and removed by API gateways"],correct:[0,1,2],explain:"Zombie APIs are old versions left running without maintenance. Shadow APIs are undocumented endpoints the security team does not know about. Both are prime attacker targets because they lack monitoring and current security controls. API gateways can help manage them but do not automatically detect all instances."},
{topic:"API Security",type:"multi",q:"How do NoSQL injection attacks differ from traditional SQL injection? (Select all that apply)",opts:["They target JSON or BSON query structures rather than SQL syntax","Attackers inject operators like $ne (not equal) or $gt (greater than) to manipulate query logic","A payload like {\"$ne\": null} can bypass authentication by returning the first valid record","They only affect MongoDB and no other database systems"],correct:[0,1,2],explain:"NoSQL injection targets document databases by manipulating JSON/BSON query operators rather than SQL strings. Operators like $ne and $gt can bypass authentication or extract data. While MongoDB is the most common target, NoSQL injection can affect any document database that processes user input in query structures."},
{topic:"API Security",type:"single",q:"What is the purpose of the HTTP Sunset header (RFC 8594) in API lifecycle management?",opts:["To indicate the time zone of the server","To programmatically communicate when an API endpoint will become unavailable, allowing client applications to anticipate retirement and migrate","To set a maximum cache duration for API responses","To specify the SSL/TLS certificate expiration date"],correct:[1],explain:"The Sunset header (RFC 8594) programmatically tells API consumers when an endpoint will be decommissioned. This allows client applications to automatically detect upcoming retirements and migrate to newer versions, preventing them from being stranded on deprecated zombie endpoints."},
{topic:"API Security",type:"multi",q:"When testing for BOLA in multi-tenant systems, what does the A-B testing strategy involve? (Select all that apply)",opts:["Creating a resource as Tenant A and attempting to access it using Tenant B's token","Testing horizontal escalation (Tenant A to Tenant B) and vertical escalation (User to Admin)","Verifying that JWTs correctly validate the 'aud' (audience) and 'iss' (issuer) claims to prevent cross-tenant token usage","Using automated tools like Burp's Autorize to replay requests with different session tokens at scale"],correct:[0,1,2,3],explain:"All four are essential components of multi-tenant authorization testing. A-B testing verifies tenant isolation. Horizontal and vertical escalation tests cover both dimensions. JWT claim validation prevents cross-tenant token abuse. Automation tools like Autorize make this scalable across complex APIs."},
{topic:"API Security",type:"single",q:"Why are webhook endpoints a primary vector for SSRF attacks?",opts:["Webhooks require authentication tokens that can be easily stolen","Webhooks accept user-supplied URLs that the server fetches without sufficient validation, allowing attackers to point them at internal services or cloud metadata endpoints","Webhooks are always exposed on public ports without any firewall protection","Webhooks transmit data in cleartext without encryption"],correct:[1],explain:"Webhooks accept user-supplied callback URLs. If the server fetches these without strict validation, attackers can redirect requests to internal IPs (localhost, 169.254.169.254) to scan internal services, fingerprint infrastructure, or steal cloud credentials from the metadata service, which is exactly how the Capital One breach occurred."},
{topic:"API Security",type:"multi",q:"What risks do 'warm' serverless environments introduce? (Select all that apply)",opts:["Sensitive data written to /tmp directories persists and remains accessible to subsequent function invocations","An attacker exploiting Local File Inclusion can recover artifacts from previous sessions","Different cloud providers have different warm environment lifetimes (AWS ~11 min, GCP ~3 min)"],correct:[0,1,2],explain:"Warm environments reuse containers for performance. Any data written to writable directories (/tmp) persists until the container is destroyed. This creates a data persistence risk where sensitive artifacts from previous executions can be recovered by attackers exploiting vulnerabilities in subsequent invocations."},
{topic:"API Security",type:"multi",q:"What are effective defenses against OS Command Injection? (Select all that apply)",opts:["Never pass unsanitized user input to system shell commands","Use parameterized APIs or libraries instead of direct shell execution","Implement strict input validation with allowlists rather than denylists","Rely on client-side JavaScript validation to filter dangerous characters"],correct:[0,1,2],explain:"OS Command Injection defenses include avoiding shell execution with user input, using parameterized APIs, and server-side allowlist validation. Client-side validation is trivially bypassed by attackers using proxies and provides zero security. All validation must happen server-side."},
// ===== DNS SECURITY =====
{topic:"DNS Security",type:"multi",q:"DNSSEC provides which security guarantees? (Select all that apply)",opts:["Proof of Origin: validates that the response came from the actual zone owner","Proof of Integrity: confirms data was not modified in transit via digital signatures","Denial of Existence: authenticated proof that a domain does not exist (NSEC/NSEC3)","Privacy/Confidentiality: encrypts DNS queries and responses to prevent eavesdropping"],correct:[0,1,2],explain:"DNSSEC provides integrity (not modified), authenticity (from the real owner), and authenticated denial of existence. Critically, DNSSEC does NOT provide privacy. Queries and responses remain in plaintext. For privacy, you need encrypted DNS protocols like DoH or DoT."},
{topic:"DNS Security",type:"single",q:"In the DNSSEC key hierarchy, what is the relationship between the ZSK and KSK?",opts:["The ZSK signs the KSK to establish trust","The KSK signs the DNSKEY RRset (which contains the ZSK), and the ZSK signs the actual DNS data records (A, MX, etc.)","Both keys sign the same records simultaneously for redundancy","The ZSK is stored at the registrar while the KSK is stored on the authoritative server"],correct:[1],explain:"The KSK (larger, rotated rarely) signs the DNSKEY record containing the ZSK's public key. The ZSK (smaller, rotated frequently) signs the actual zone data. This split reduces administrative burden since only KSK rotations require updating the DS record at the parent/registrar."},
{topic:"DNS Security",type:"multi",q:"Why is the 'Golden Rule' of DNS operations to never mix Authoritative Servers and Recursive Resolvers on the same machine? (Select all that apply)",opts:["Mixing them creates an Open Resolver that attackers exploit for DDoS Amplification attacks","An open resolver processes queries from anyone and sends amplified responses to spoofed victim IPs","Recursive resolvers must only accept queries from internal subnets via strict ACLs"],correct:[0,1,2],explain:"Mixing roles creates an Open Resolver where attackers spoof victim IPs and send small queries that generate large responses, creating a DDoS amplification effect. Recursive resolvers must be restricted via ACLs to internal subnets only, treating DNS servers with the same rigor as securing an email relay."},
{topic:"DNS Security",type:"single",q:"What is the Delegation Signer (DS) record and why is it the 'critical link' in the DNSSEC Chain of Trust?",opts:["A record that stores the domain owner's email address for WHOIS","A hash of the child zone's KSK that resides in the parent zone, creating the cryptographic glue between zones in the trust hierarchy","A record that specifies which DNS server should handle mail delivery","A record that maps domain names to IPv6 addresses"],correct:[1],explain:"The DS record contains a hash of the child zone's KSK and lives in the parent zone (e.g., .com managed by Verisign). Because the parent signs the DS record with its own key, it creates an unbreakable chain from root to leaf. This is why KSK rotations require registrar coordination."},
{topic:"DNS Security",type:"multi",q:"What is DNS Response Policy Zone (RPZ) and how is it used as active defense? (Select all that apply)",opts:["RPZ turns the DNS server into a firewall by intercepting queries for known malicious domains","It can return NXDOMAIN to kill connections before they start","It can redirect queries to a sinkhole/honeypot for malware analysis and infected host identification","RPZ encrypts all DNS traffic to prevent eavesdropping"],correct:[0,1,2],explain:"RPZ is an active defense mechanism that intercepts malicious DNS queries. It can block connections (NXDOMAIN), or redirect to sinkholes for analysis and identification of infected hosts. RPZ does NOT provide encryption; that is the role of DoH/DoT."},
{topic:"DNS Security",type:"single",q:"The analogy 'DNSSEC is a wax seal; DoH/DoT is a locked briefcase' illustrates what distinction?",opts:["DNSSEC is faster than DoH/DoT","DNSSEC provides integrity and authenticity (the data is genuine and unaltered) but NOT privacy; DoH/DoT provides confidentiality (the content is hidden from observers) but does not validate authenticity","DNSSEC and DoH/DoT provide identical security guarantees","DoH/DoT has replaced DNSSEC entirely in modern deployments"],correct:[1],explain:"DNSSEC (wax seal) guarantees the DNS response is authentic and unaltered but queries remain visible. DoH/DoT (locked briefcase) encrypts queries for privacy but does not inherently validate data authenticity. Complete DNS security requires BOTH: the seal for trust and the briefcase for privacy."},
{topic:"DNS Security",type:"multi",q:"What makes DNS tunneling effective for data exfiltration even in well-segmented networks? (Select all that apply)",opts:["The compromised host does not need direct internet access; it only needs to reach an internal recursive resolver that forwards queries to the internet","Firewalls almost always allow UDP 53 because blocking DNS breaks all network functionality","Stolen data is encoded (Base32/Hex) into subdomains of queries to attacker-controlled domains","C2 instructions are returned via DNS response records (TXT, CNAME, MX)"],correct:[0,1,2,3],explain:"All four factors make DNS tunneling devastatingly effective. Even strict network segmentation fails because internal DNS resolvers forward queries outbound. UDP 53 is universally allowed. Data hides in subdomains, and commands return in response records, creating a bidirectional covert channel."},
{topic:"DNS Security",type:"single",q:"What is 'Subdomain Takeover' and why is it the #1 bug bounty finding in cloud environments?",opts:["Attackers brute-force subdomains using dictionary attacks to guess valid hostnames","A DNS CNAME record points to a deprovisioned cloud resource (dangling CNAME), allowing an attacker to claim that resource and serve malicious content under the legitimate domain","Attackers modify the parent domain's NS records at the registrar","Attackers flood subdomain queries to cause DNS amplification"],correct:[1],explain:"Subdomain Takeover occurs when organizations delete cloud resources (S3 bucket, EC2 instance) but forget to remove the DNS CNAME pointing to them. An attacker creates a new resource with the same name, claiming the subdomain and serving malicious content under the legitimate organization's trusted domain."},
// ===== BGP SECURITY =====
{topic:"BGP & Routing",type:"multi",q:"What does RPKI (Resource Public Key Infrastructure) validate, and what does it NOT validate?",opts:["RPKI validates the ORIGIN: that a specific ASN is authorized to announce a given IP prefix","RPKI does NOT validate the PATH: it cannot verify that the AS path in a BGP update is legitimate","ROAs (Route Origin Authorizations) are the signed documents proving prefix ownership","RPKI validates both the origin AND the complete AS path end-to-end"],correct:[0,1,2],explain:"RPKI validates origin only (which AS can announce which prefix) through cryptographically signed ROAs. It does NOT validate the AS path. Path validation is the domain of BGPsec, which exists theoretically but faces significant adoption barriers due to hardware costs and operational complexity."},
{topic:"BGP & Routing",type:"multi",q:"What are the three ROA validation states and what do they mean? (Select all that apply)",opts:["Valid: the route matches a published ROA (the announcement is authorized)","Invalid: the route conflicts with a published ROA (likely a hijack or misconfiguration)","Not Found: no ROA exists for this prefix (unknown authorization status)","Expired: the ROA certificate has been revoked by the RIR"],correct:[0,1,2],explain:"The three ROA states are Valid (authorized), Invalid (conflicts with published ROA, indicating hijack/misconfiguration), and Not Found (no ROA published, status unknown). The goal is moving the internet from 'Not Found' to 'Valid.' 'Expired' is not a standard validation state."},
{topic:"BGP & Routing",type:"multi",q:"What are effective BGP 'basic hygiene' controls? (Select all that apply)",opts:["Prefix filtering with a 'Deny All' default, explicitly permitting only known-valid prefixes","Max-Prefix Limits that tear down BGP sessions if a neighbor sends an abnormal number of routes","Bogon filtering to block RFC 1918 private addresses and reserved space from the public routing table","Accepting all route advertisements from all peers to maintain maximum internet connectivity"],correct:[0,1,2],explain:"BGP hygiene includes deny-all prefix filtering, max-prefix limits as a circuit breaker against route leaks, and bogon filtering to block private/reserved addresses. Blindly accepting all advertisements is the fundamental vulnerability that these controls are designed to prevent."},
{topic:"BGP & Routing",type:"single",q:"Why is Out-of-Band (OOB) Management critical during a DDoS attack?",opts:["It provides faster internet connectivity for users during the attack","It creates a dedicated management network isolated from production, ensuring administrators retain console access to devices even when the production network is saturated by attack traffic","It automatically blocks all DDoS traffic at the network edge","It encrypts management traffic to prevent eavesdropping during the attack"],correct:[1],explain:"During a volumetric DDoS, the production network's bandwidth is consumed by malicious traffic, making in-band management (SSH over the same network) impossible. An OOB management network is physically or logically separated, acting as a 'back door' that ensures administrators can still access devices to apply filters and remediate the attack."},
{topic:"BGP & Routing",type:"multi",q:"BGP anomaly detection monitors which key metrics to identify attacks? (Select all that apply)",opts:["Prefix Count spikes (e.g., a neighbor sending 5,000 routes instead of 50) indicating route leaks","AS Path changes (traffic suddenly routing through unknown ASNs) indicating hijacks","Session Flaps (BGP sessions resetting repeatedly) indicating control plane instability or attack"],correct:[0,1,2],explain:"BGP anomaly detection treats routing like a heartbeat monitor. Sudden prefix count spikes indicate route leaks, unexpected AS path changes indicate hijacks, and session flapping indicates control plane attacks or misconfigurations. Any of these 'cardiac events' warrants immediate investigation."},
{topic:"BGP & Routing",type:"single",q:"Why can internal logs alone NOT detect a BGP hijack affecting your organization?",opts:["Internal logs do not record any network activity","Internal logs show traffic successfully leaving your border but cannot see what happens after, such as traffic being redirected to an attacker's infrastructure downstream","BGP hijacks only affect other organizations, never the victim","Internal logs automatically detect and report all BGP anomalies"],correct:[1],explain:"Internal logs show packets leaving your border router successfully. But a BGP hijack happens in the global routing table AFTER your traffic leaves. Your logs show 'everything is fine' while the rest of the internet routes your traffic through an attacker's infrastructure. External monitoring (BGPStream, Looking Glasses) is essential."},
// ===== IaC & TESTING =====
{topic:"DevSecOps",type:"multi",q:"What security risks does Infrastructure as Code (IaC) introduce? (Select all that apply)",opts:["A single misconfigured template can deploy thousands of insecure resources instantly","Templates provide a 'blueprint' of the environment, helping attackers identify weaknesses if they access the source repo","Common findings include hardcoded credentials, unencrypted storage, and security groups allowing 0.0.0.0/0 access"],correct:[0,1,2],explain:"IaC enables rapid deployment but also rapid propagation of security errors. A single template mistake creates thousands of vulnerable assets. Templates also serve as reconnaissance material for attackers. Common findings (hardcoded secrets, public storage, permissive networking) are the 'low-hanging fruit' that IaC scanners like Checkov and tfsec detect."},
{topic:"DevSecOps",type:"single",q:"What does 'Shift Left' mean in the context of DevSecOps and IaC security?",opts:["Moving security testing to production environments for real-world validation","Integrating security testing as early as possible in the SDLC, scanning IaC templates in CI/CD pipelines before any resources are provisioned","Shifting security responsibility entirely to the development team","Moving all infrastructure to the leftmost AWS region for compliance"],correct:[1],explain:"'Shift Left' means integrating security testing early in the development lifecycle. For IaC, this means scanning templates with tools like Checkov/tfsec in the CI/CD pipeline BEFORE deployment. The pipeline 'stops the line' and blocks non-compliant deployments, preventing 'born insecure' infrastructure from reaching production."},
{topic:"DevSecOps",type:"multi",q:"What is the hybrid approach to API security testing? (Select all that apply)",opts:["Automated scanning (DAST/SAST) provides breadth by finding 'low-hanging fruit' like injection flaws across the entire attack surface","Manual testing provides depth by identifying business logic vulnerabilities (BOLA/BFLA) that scanners cannot understand","Manual findings are used to tune automated tools, reducing false positives and improving detection","Automated scanners alone are sufficient for complete API security coverage"],correct:[0,1,2],explain:"The hybrid approach combines automated scanning for breadth (common vulnerabilities at scale) with manual testing for depth (business logic flaws, complex authorization issues). Manual findings improve automated tools. Relying on automation alone provides a false sense of security since scanners miss logic flaws."},
{topic:"DevSecOps",type:"single",q:"The Tesla Kubernetes breach (2018) occurred because:",opts:["Attackers exploited a zero-day in the Kubernetes scheduler","An unauthenticated Kubernetes dashboard was publicly exposed, allowing attackers to access cluster secrets including AWS credentials","The container images were not signed with Cosign","BGP hijacking redirected traffic to the attacker's cluster"],correct:[1],explain:"Tesla's Kubernetes dashboard was left publicly accessible without authentication. Attackers accessed cluster secrets (including AWS credentials) through the exposed dashboard and used them to mine cryptocurrency. This demonstrates why management interfaces must never be exposed without strict authentication and RBAC."},
// ===== CLOUD IMPLICATIONS =====
{topic:"Cloud & DNS",type:"multi",q:"What are the limitations of managed DNS services like Route 53 and Azure DNS? (Select all that apply)",opts:["Query logging is often not enabled by default and requires additional cost to activate","You share nameserver infrastructure with thousands of other tenants, creating 'noisy neighbor' DDoS risk","You outsource BGP security to the provider; if their routes are hijacked, your zones are hijacked"],correct:[0,1,2],explain:"Managed DNS abstracts complexity but trades away control. Query logs require explicit (paid) enablement. Shared infrastructure means a DDoS against another tenant can degrade your service. And you implicitly trust the provider to secure the BGP routes to their nameservers."},
{topic:"Cloud & DNS",type:"single",q:"What is the 'Split Brain' DNS problem in hybrid cloud environments?",opts:["DNS servers randomly returning different IP addresses for the same query","AWS instances need to resolve on-prem names (intranet.corp) while on-prem servers need to resolve cloud names (app.aws.corp), requiring fragile Resolver Endpoints and conditional forwarders across both environments","A DNS server experiencing a hardware failure that splits its database","Two DNS servers competing to be the primary authoritative source"],correct:[1],explain:"The Split Brain problem occurs when on-prem and cloud environments need to resolve each other's private DNS names. This requires Inbound Endpoints (for on-prem to query cloud DNS) and Outbound Endpoints (for cloud to query on-prem DNS via VPN/Direct Connect), creating a fragile architecture of conditional forwarders that is difficult to troubleshoot."},
{topic:"Cloud & DNS",type:"multi",q:"The 'Splinternet' trend impacts network architecture through which developments? (Select all that apply)",opts:["Countries mandating specific BGP paths to avoid routing traffic through hostile nations","Data Sovereignty laws requiring data storage and DNS resolution within national borders","Network architects designing routing policies for legal compliance rather than technical efficiency","Wrapped tokens inspecting region claims to re-route users to their home region for sovereignty compliance"],correct:[0,1,2,3],explain:"All four are consequences of geopolitical fragmentation. The Splinternet forces architects to consider legal compliance over performance: mandated routing paths, in-country data residency, compliance-driven architecture decisions, and identity-based re-routing using region claims in tokens."},
{topic:"Cloud & DNS",type:"single",q:"In the context of future threats, how are attackers using AI to defeat DNS-based detection of Domain Generation Algorithms (DGAs)?",opts:["Using AI to encrypt DNS queries so they cannot be inspected","Using Generative AI to produce 'human-like' domains composed of legitimate words that have low entropy, bypassing entropy-based mathematical detection filters","Using AI to physically destroy DNS servers","Using AI to speed up DNS resolution times"],correct:[1],explain:"Traditional DGA detection flags domains with high randomness/entropy (e.g., xyqz123.com). Attackers now use AI to generate domains from real dictionary words, producing low-entropy names that blend with normal traffic and bypass mathematical detection. This escalation drives a 'Machine vs. Machine' warfare dynamic."},
// ===== VIRTUALIZATION =====
{topic:"Virtualization",type:"multi",q:"What security benefits does the Trusted Platform Module (TPM) provide in virtualized environments? (Select all that apply)",opts:["It acts as a hardware root of trust that stores cryptographic keys","It measures boot component integrity (hashing BIOS, bootloader, kernel)","It enables Remote Attestation, proving a system booted in a secure, unaltered state before joining the cluster"],correct:[0,1,2],explain:"TPM provides hardware-based security through three functions: storing keys securely, measuring boot integrity through hash chains, and enabling Remote Attestation where systems cryptographically prove they booted cleanly before being trusted. This prevents compromised systems from joining the infrastructure."},
{topic:"Virtualization",type:"single",q:"In the VM lifecycle, what is the security risk of 'Golden Image' templates that contain embedded secrets?",opts:["The secrets improve performance by pre-loading authentication data","Any vulnerability or embedded secret in the master image will be replicated across every single instance deployed from it, creating widespread exposure","Embedded secrets are automatically encrypted by the hypervisor","Golden Images with secrets cannot be deployed in cloud environments"],correct:[1],explain:"Golden Images are the root of trust for compute. Any secret (API key, password) embedded in the image propagates to every instance. If 100 servers deploy from a compromised image, all 100 inherit the vulnerability. Images must be clean of secrets, retrieving them from vault services at runtime instead."},
// ===== ADDITIONAL DEPTH =====
{topic:"API Security",type:"single",q:"What is 'Excessive Data Exposure' in API design, and why does it violate least privilege?",opts:["Returning too many error messages to the client","APIs returning full database object representations and relying on the frontend UI to filter what is displayed, which attackers bypass using interception proxies to view raw sensitive data","Sending too many API requests per second","Logging excessive amounts of data to disk"],correct:[1],explain:"Excessive Data Exposure occurs when APIs return complete objects and trust the frontend to hide sensitive fields. Attackers use proxies (Burp Suite, ZAP) to intercept raw responses and see all data. Least privilege requires filtering and masking at the BACKEND, returning only fields the client legitimately needs."},
{topic:"Web & App Security",type:"multi",q:"What are the three types of Cross-Site Scripting (XSS)? (Select all that apply)",opts:["Reflected (Type 2): malicious script immediately returned via HTTP GET parameters in a crafted URL","Stored (Type 1): payload permanently stored on the server (e.g., comment field) and served to all visitors","DOM-Based (Type 0): vulnerability exists entirely in client-side code where the DOM is modified without the payload reaching the server"],correct:[0,1,2],explain:"XSS has three types: Reflected (non-persistent, requires social engineering via crafted links), Stored (persistent, affects all visitors to the affected page), and DOM-Based (client-side only, exploits JavaScript that unsafely handles data sources like URL fragments). Each requires different detection and mitigation approaches."},
{topic:"Cloud Security",type:"single",q:"What is 'Token Theft' in cloud environments, and why does it bypass MFA?",opts:["Stealing a user's password from a phishing email","Stealing Bearer Tokens or session cookies (like Azure PRT) that have already passed the MFA check, allowing the attacker to authenticate without triggering MFA again","Brute-forcing the MFA code by trying all possible 6-digit combinations","Physically stealing the user's hardware security key"],correct:[1],explain:"Bearer Tokens are 'cash': whoever holds them owns the session. Since tokens are issued AFTER successful MFA, stealing them bypasses MFA entirely. Attackers harvest tokens from plaintext files on developer workstations (~/.azure/msal_token_cache.json) or intercept them via tools like Evilginx during the login flow."},
{topic:"BGP & Routing",type:"single",q:"Why has BGPsec not seen widespread adoption despite being the theoretical solution for AS path validation?",opts:["BGPsec is incompatible with modern routing hardware","BGPsec faces significant barriers including hardware cost, operational complexity, and the requirement for every router in the path to support it","BGPsec has been officially deprecated by the IETF","BGPsec only works with IPv6, not IPv4"],correct:[1],explain:"BGPsec validates the entire AS path (not just origin like RPKI), but requires every router along the path to support it, introduces significant computational overhead, and has high hardware costs. This 'all-or-nothing' deployment requirement and operational complexity have prevented widespread adoption."},
{topic:"Cloud Security",type:"multi",q:"What is 'Workload Identity Federation' and why is it preferred over long-lived IAM keys? (Select all that apply)",opts:["It allows external systems (on-prem, GitHub Actions) to exchange OIDC tokens for short-lived cloud credentials","It eliminates storing static cloud keys on external servers, removing a major breach vector","Short-lived credentials automatically expire, limiting the window of abuse if compromised"],correct:[0,1,2],explain:"Workload Identity Federation allows external workloads to authenticate to cloud services by exchanging standard OIDC tokens for short-lived credentials. This eliminates the need for long-lived static keys (a leading cause of breaches) and ensures credentials expire automatically, limiting damage from any compromise."},
];

let activeTopics=new Set(),filteredQs=[],answers={},correctCount=0,wrongCount=0;
const topics=[...new Set(ALL_QUESTIONS.map(q=>q.topic))];
const pillsEl=document.getElementById('topicPills');
function renderPills(){pillsEl.innerHTML=`<button class="topic-pill ${activeTopics.size===0?'active':''}" onclick="toggleTopic(null)">All Topics</button>`;topics.forEach(t=>{pillsEl.innerHTML+=`<button class="topic-pill ${activeTopics.has(t)?'active':''}" onclick="toggleTopic('${t}')">${t}</button>`})}
function toggleTopic(t){if(t===null)activeTopics.clear();else{if(activeTopics.has(t))activeTopics.delete(t);else activeTopics.add(t)}renderPills()}
renderPills();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){filteredQs=activeTopics.size===0?[...ALL_QUESTIONS]:ALL_QUESTIONS.filter(q=>activeTopics.has(q.topic));shuffle(filteredQs);answers={};correctCount=0;wrongCount=0;document.getElementById('header').classList.add('hidden');document.getElementById('quizArea').classList.remove('hidden');document.getElementById('resultsCard').classList.add('hidden');renderQuestions();updateStats();window.scrollTo({top:0})}
function renderQuestions(){const c=document.getElementById('questionsContainer');c.innerHTML='';filteredQs.forEach((q,i)=>{const isMulti=q.type==='multi';const letters=['A','B','C','D'];let optHtml=q.opts.map((o,j)=>`<div class="opt" data-qi="${i}" data-oi="${j}" onclick="selectOpt(${i},${j})"><div class="opt-marker">${letters[j]}</div><div class="opt-text">${o}</div></div>`).join('');c.innerHTML+=`<div class="q-card" id="qcard-${i}"><div class="q-meta"><span class="q-num">Q${i+1}</span><span class="q-type">${isMulti?'Multi-Select':'Single Answer'}</span><span class="q-topic">${q.topic}</span></div><div class="q-text">${q.q}</div><div class="options ${isMulti?'multi':'single'}" id="opts-${i}">${optHtml}</div><div class="submit-row" id="sub-${i}"><button class="btn btn-primary" id="subbtn-${i}" onclick="submitAnswer(${i})" disabled>Submit</button></div><div class="explanation" id="exp-${i}"></div></div>`})}
function selectOpt(qi,oi){if(answers[qi]!==undefined)return;const q=filteredQs[qi];const isMulti=q.type==='multi';const opts=document.querySelectorAll(`#opts-${qi} .opt`);if(isMulti){opts[oi].classList.toggle('selected')}else{opts.forEach(o=>o.classList.remove('selected'));opts[oi].classList.add('selected')}document.getElementById(`subbtn-${qi}`).disabled=document.querySelectorAll(`#opts-${qi} .opt.selected`).length===0}
function submitAnswer(qi){if(answers[qi]!==undefined)return;const q=filteredQs[qi];const opts=document.querySelectorAll(`#opts-${qi} .opt`);const selected=[];opts.forEach((o,j)=>{if(o.classList.contains('selected'))selected.push(j)});opts.forEach(o=>o.classList.add('locked'));const correctSet=new Set(q.correct);const selectedSet=new Set(selected);const isCorrect=correctSet.size===selectedSet.size&&[...correctSet].every(v=>selectedSet.has(v));opts.forEach((o,j)=>{if(correctSet.has(j))o.classList.add('correct-answer');if(selectedSet.has(j)&&!correctSet.has(j))o.classList.add('wrong-answer')});const card=document.getElementById(`qcard-${qi}`);card.classList.add(isCorrect?'answered-correct':'answered-wrong');const exp=document.getElementById(`exp-${qi}`);exp.className=`explanation show ${isCorrect?'correct-exp':'wrong-exp'}`;exp.innerHTML=`<strong>${isCorrect?'✓ Correct!':'✗ Incorrect.'}</strong> ${q.explain}`;document.getElementById(`sub-${qi}`).innerHTML=`<span style="font-size:13px;color:${isCorrect?'var(--green)':'var(--red)'};font-weight:600">${isCorrect?'Correct':'Incorrect'}</span>`;answers[qi]=isCorrect;if(isCorrect)correctCount++;else wrongCount++;updateStats();if(Object.keys(answers).length===filteredQs.length)setTimeout(showResults,600)}
function updateStats(){const total=filteredQs.length;const answered=Object.keys(answers).length;document.getElementById('progressFill').style.width=`${(answered/total)*100}%`;document.getElementById('progressLabel').textContent=`${answered} / ${total}`;document.getElementById('statCorrect').textContent=`✓ ${correctCount}`;document.getElementById('statWrong').textContent=`✗ ${wrongCount}`;document.getElementById('statPending').textContent=`○ ${total-answered} remaining`}
function showResults(){const total=filteredQs.length;const pct=Math.round((correctCount/total)*100);document.getElementById('finalScore').textContent=`${pct}%`;document.getElementById('finalCorrect').textContent=correctCount;document.getElementById('finalWrong').textContent=wrongCount;document.getElementById('finalTotal').textContent=total;document.getElementById('resultsCard').classList.remove('hidden');document.getElementById('reviewBtn').style.display=wrongCount>0?'inline-block':'none';document.getElementById('resultsCard').scrollIntoView({behavior:'smooth'})}
function resetQuiz(){document.getElementById('header').classList.remove('hidden');document.getElementById('quizArea').classList.add('hidden');window.scrollTo({top:0})}
function reviewWrong(){document.querySelectorAll('.q-card').forEach((c,i)=>{c.style.display=answers[i]===true?'none':''});document.getElementById('resultsCard').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('scroll',()=>{document.getElementById('scrollTop').classList.toggle('visible',window.scrollY>400)});
</script>
</body>
